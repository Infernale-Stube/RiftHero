name: rifthero

# Global log rotation defaults (caps log sizes at 150MB per container)
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:
  # =========================================================================
  # 1. Caddy Reverse Proxy (Automatic Let's Encrypt HTTPS / TLS)
  # =========================================================================
  caddy:
    <<: *default-logging
    image: caddy:2-alpine
    container_name: rifthero-caddy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CADDY_HTTP_PORT}:80"
      - "${CADDY_HTTPS_PORT}:443"
      - "${CADDY_HTTPS_PORT}:443/udp"
    env_file:
      - path: .env
        required: true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # =========================================================================
  # 2. RiftHero Next.js Frontend (App Router, Tailwind CSS, Dark Mode)
  # =========================================================================
  frontend:
    <<: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: rifthero-frontend:latest
    pull_policy: build
    container_name: rifthero-frontend
    restart: unless-stopped
    ports:
      - "${BIND_IP}:${FRONTEND_PORT}:3000"
    env_file:
      - path: .env
        required: true
    environment:
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || node -e \"fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================================
  # 3. RiftHero REST API (Fastify Node.js Service)
  # =========================================================================
  api:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rifthero-backend:latest
    pull_policy: build
    container_name: rifthero-api
    command: ["api"]
    restart: unless-stopped
    ports:
      - "${BIND_IP}:${PORT}:4000"
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 25s

  # =========================================================================
  # 4. RiftHero High-Priority Worker (Interactive User Lookups & Refreshes)
  # =========================================================================
  worker-high:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rifthero-backend:latest
    pull_policy: build
    container_name: rifthero-worker-high
    command: ["worker:high"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 5. RiftHero Low-Priority Worker (Snowball Background Crawler)
  # =========================================================================
  worker-low:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rifthero-backend:latest
    pull_policy: build
    container_name: rifthero-worker-low
    command: ["worker:low"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 6. RiftHero Champion & Item Catalog Sync Worker (Hourly Patch Checks)
  # =========================================================================
  worker-champions:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rifthero-backend:latest
    pull_policy: build
    container_name: rifthero-worker-champions
    command: ["worker:champions"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 7. RiftHero Meta & Tier List Worker (6h Periodic Statistical Aggregation)
  # =========================================================================
  worker-meta:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rifthero-backend:latest
    pull_policy: build
    container_name: rifthero-worker-meta
    command: ["worker:meta"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 8. RiftHero CounterPick Scraper Worker (Hourly Lolalytics & DDragon Sync)
  # =========================================================================
  worker-counterpicks:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rifthero-backend:latest
    pull_policy: build
    container_name: rifthero-worker-counterpicks
    command: ["worker:counterpicks"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      - NODE_OPTIONS=--max-old-space-size=1536
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 9. RiftHero Maintenance Worker (Daily Vacuum, BullMQ Pruning, Backups)
  # =========================================================================
  worker-maintenance:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rifthero-backend:latest
    pull_policy: build
    container_name: rifthero-worker-maintenance
    command: ["worker:maintenance"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    volumes:
      - backups-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 10. PostgreSQL 16 Database
  # =========================================================================
  postgres:
    <<: *default-logging
    image: postgres:16-alpine
    container_name: rifthero-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # 11. Redis 7 (In-Memory Datastore & BullMQ Queue Broker)
  # =========================================================================
  redis:
    <<: *default-logging
    image: redis:7-alpine
    container_name: rifthero-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # =========================================================================
  # 12. Production Mailserver (docker-mailserver)
  # =========================================================================
  mailserver:
    <<: *default-logging
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: rifthero-mailserver
    hostname: mail
    domainname: ${APP_DOMAIN}
    restart: unless-stopped
    ports:
      - "25:25"     # SMTP
      - "465:465"   # SMTPS
      - "587:587"   # Submission
      - "993:993"   # IMAPS
    environment:
      - OVERRIDE_HOSTNAME=mail.${APP_DOMAIN}
      - LOG_LEVEL=${MAIL_LOG_LEVEL}
      - ONE_DIR=1
      - POSTMASTER_ADDRESS=${POSTMASTER_ADDRESS}
      - ENABLE_RSPAMD=1
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=0
      - PERMIT_DOCKER=network
      - SSL_TYPE=${MAIL_SSL_TYPE}
      - SSL_CERT_PATH=/tmp/docker-mailserver/ssl/cert.pem
      - SSL_KEY_PATH=/tmp/docker-mailserver/ssl/key.pem
    cap_add:
      - NET_ADMIN
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      - ./docker/mailserver:/tmp/docker-mailserver
      - caddy-data:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "/usr/bin/supervisorctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# =========================================================================
# Volumes
# =========================================================================
volumes:
  caddy-data:
    name: rifthero-caddy-data
  caddy-config:
    name: rifthero-caddy-config
  postgres-data:
    name: rifthero-postgres-data
  redis-data:
    name: rifthero-redis-data
  mail-data:
    name: rifthero-mail-data
  mail-state:
    name: rifthero-mail-state
  mail-logs:
    name: rifthero-mail-logs
  backups-data:
    name: rifthero-backups-data
