<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Bright Specular Gold -->
    <linearGradient id="cw-gold-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Primary Rich Gold -->
    <linearGradient id="cw-gold-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Shaded Chiseled Gold -->
    <linearGradient id="cw-gold-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Deep Dark Obsidian Steel -->
    <linearGradient id="cw-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="60%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Blazing Rift Core Energy -->
    <linearGradient id="cw-rift-fire" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Radial Core Energy Burst -->
    <radialGradient id="cw-core-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#F97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Core Glow Burst -->
  <circle cx="60" cy="58" r="34" fill="url(#cw-core-burst)" />

  <!-- LEFT WING -->
  <path d="M60 48 L46 38 L22 18 C16 28 14 42 24 54 L44 58 L60 48 Z" fill="url(#cw-steel)" />
  <path d="M60 48 L46 38 L22 18 C26 12 38 18 48 28 L60 40 Z" fill="url(#cw-gold-highlight)" />
  <path d="M48 28 L22 18 C14 26 12 40 18 52 L32 50 C24 38 32 28 48 28 Z" fill="url(#cw-gold-body)" />

  <path d="M60 62 L42 58 L12 48 C8 58 10 70 20 80 L38 72 L54 66 Z" fill="url(#cw-gold-shadow)" />
  <path d="M56 60 L38 56 L12 48 C16 44 26 48 38 52 L54 62 Z" fill="url(#cw-gold-highlight)" />
  <path d="M42 58 L12 48 C14 62 24 74 36 74 L46 64 Z" fill="url(#cw-gold-body)" />

  <path d="M60 76 L48 70 L26 80 C32 90 42 98 56 102 L60 88 Z" fill="url(#cw-gold-shadow)" />
  <path d="M58 74 L46 68 L26 80 C34 84 46 84 56 80 Z" fill="url(#cw-gold-highlight)" />

  <!-- RIGHT WING -->
  <path d="M60 48 L74 38 L98 18 C104 28 106 42 96 54 L76 58 L60 48 Z" fill="url(#cw-steel)" />
  <path d="M60 48 L74 38 L98 18 C94 12 82 18 72 28 L60 40 Z" fill="url(#cw-gold-highlight)" />
  <path d="M72 28 L98 18 C106 26 108 40 102 52 L88 50 C96 38 88 28 72 28 Z" fill="url(#cw-gold-body)" />

  <path d="M60 62 L78 58 L108 48 C112 58 110 70 100 80 L82 72 L66 66 Z" fill="url(#cw-gold-shadow)" />
  <path d="M64 60 L82 56 L108 48 C104 44 94 48 82 52 L66 62 Z" fill="url(#cw-gold-highlight)" />
  <path d="M78 58 L108 48 C106 62 96 74 84 74 L74 64 Z" fill="url(#cw-gold-body)" />

  <path d="M60 76 L72 70 L94 80 C88 90 78 98 64 102 L60 88 Z" fill="url(#cw-gold-shadow)" />
  <path d="M62 74 L74 68 L94 80 C86 84 74 84 64 80 Z" fill="url(#cw-gold-highlight)" />

  <!-- TOP CROWN -->
  <polygon points="60,10 68,26 60,34 52,26" fill="url(#cw-gold-highlight)" />
  <polygon points="60,10 52,26 60,34" fill="url(#cw-gold-body)" />
  <circle cx="60" cy="24" r="2.5" fill="#FFFBEB" />

  <!-- CENTRAL CRYSTAL HOUSING -->
  <path d="M60 36 L72 48 L70 70 L60 84 L50 70 L48 48 Z" fill="#0A0E17" stroke="url(#cw-gold-body)" stroke-width="1.5" />

  <!-- CENTRAL RIFT CRYSTAL -->
  <polygon points="60,40 70,58 60,78 50,58" fill="url(#cw-rift-fire)" opacity="0.5" />
  <polygon points="60,41 51,58 60,77" fill="#F97316" />
  <polygon points="60,41 69,58 60,77" fill="url(#cw-rift-fire)" />
  <polygon points="60,46 65,58 60,70 55,58" fill="#FFFBEB" opacity="0.95" />

  <!-- RIFT FRACTURE -->
  <path d="M60,43 L58,52 L62,57 L58,64 L61,69 L60,74" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- BOTTOM FINIAL -->
  <polygon points="60,86 66,96 60,106 54,96" fill="url(#cw-gold-highlight)" />
  <polygon points="60,86 54,96 60,106" fill="url(#cw-gold-shadow)" />
</svg>
